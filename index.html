<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clube de Estudos</title>
  <style>
    :root {
      --ink: #18304b;
      --paper: #fff8dc;
      --sky: #48c7df;
      --pink: #fa5c89;
      --yellow: #ffc938;
      --green: #62c65c;
      --blue: #5265d9;
      --shadow: #18304b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Nunito, sans-serif;
      background-color: #61cce0;
      background-image: linear-gradient(90deg, rgba(255,255,255,.17) 2px, transparent 2px), linear-gradient(rgba(255,255,255,.17) 2px, transparent 2px);
      background-size: 28px 28px;
    }

    button { font: inherit; cursor: pointer; }

    .game-shell {
      width: min(940px, calc(100% - 28px));
      margin: 24px auto;
      border: 4px solid var(--shadow);
      box-shadow: 8px 8px 0 var(--shadow);
      background: var(--paper);
    }

    header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 20px 24px;
      border-bottom: 4px solid var(--shadow);
      background: var(--yellow);
    }

    .pixel-badge, .icon { font-family: 'Press Start 2P', monospace; }
    .pixel-badge { color: var(--pink); font-size: 32px; text-shadow: 3px 3px 0 #fff; }
    h1 { margin: 0; font: 16px/1.5 'Press Start 2P', monospace; }
    .subtitle { margin: 4px 0 0; font-size: 15px; font-weight: 900; }
    .score-box { padding: 10px 12px; color: #fff; text-align: center; background: var(--blue); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    .score-box strong { display: block; font: 13px 'Press Start 2P', monospace; }
    .score-box span { font-size: 13px; font-weight: 900; }

    main { padding: 26px; }
    .mission-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
    .mission-tab { border: 3px solid var(--ink); padding: 10px 13px; color: var(--ink); background: #fff; font-weight: 900; box-shadow: 3px 3px 0 var(--ink); }
    .mission-tab.active { color: #fff; background: var(--pink); transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .mission-tab:disabled { opacity: .52; cursor: not-allowed; }

    .progress-line { height: 16px; margin-bottom: 25px; overflow: hidden; border: 3px solid var(--ink); background: #d9eef0; }
    .progress-fill { width: 0; height: 100%; transition: width .35s ease; background: repeating-linear-gradient(90deg, var(--green) 0 16px, #90e371 16px 20px); }

    .question-card { min-height: 344px; padding: clamp(20px, 5vw, 42px); border: 4px solid var(--ink); background: #fff; box-shadow: 6px 6px 0 var(--ink); }
    .topic { display: inline-block; margin: 0 0 17px; padding: 7px 9px; font: 10px 'Press Start 2P', monospace; color: #fff; background: var(--blue); }
    .question-number { float: right; padding-top: 6px; font-size: 14px; font-weight: 900; }
    h2 { clear: both; max-width: 680px; margin: 0 0 26px; font-size: clamp(25px, 4vw, 38px); line-height: 1.12; }
    .question-image { display: block; width: min(100%, 420px); max-height: 290px; margin: 0 auto 24px; object-fit: cover; object-position: center; border: 4px solid var(--ink); box-shadow: 5px 5px 0 var(--yellow); }
    .answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .answer { min-height: 68px; padding: 12px; display: flex; align-items: center; gap: 10px; text-align: left; border: 3px solid var(--ink); background: #fff8dc; box-shadow: 4px 4px 0 var(--ink); font-size: 18px; font-weight: 900; }
    .answer:hover:not(:disabled) { background: #fff0a9; transform: translate(-1px, -1px); }
    .answer:disabled { cursor: default; }
    .answer.correct { color: #135e2d; background: #baf1b6; }
    .answer.wrong { color: #9b2844; background: #ffd0dc; }
    .answer-key { display: inline-grid; width: 28px; height: 28px; place-items: center; flex: none; font: 11px 'Press Start 2P', monospace; color: #fff; background: var(--blue); }
    .feedback { min-height: 31px; margin: 22px 0 0; font-size: 17px; font-weight: 900; }
    .feedback.good { color: #138238; }
    .feedback.bad { color: #bd3154; }

    .match-game { text-align: center; }
    .match-game h2 { max-width: 760px; margin: 5px auto 10px; }
    .match-help { margin: 0 0 22px; font-size: 17px; font-weight: 900; }
    .material-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .material-card { min-height: 116px; padding: 12px 8px; border: 3px solid var(--ink); color: var(--ink); background: #fff8dc; box-shadow: 4px 4px 0 var(--ink); font-weight: 900; }
    .material-card:hover:not(:disabled), .material-card.selected { background: var(--yellow); transform: translate(-2px, -2px); }
    .material-card.done { visibility: hidden; }
    .material-icon { display: block; margin-bottom: 8px; font-size: 42px; line-height: 1; }
    .origin-choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
    .origin-choice { min-height: 67px; padding: 8px; border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); color: var(--ink); background: #fff; font-size: 15px; font-weight: 900; }
    .origin-choice:nth-child(1) { background: #aee573; }
    .origin-choice:nth-child(2) { background: #ffd06a; }
    .origin-choice:nth-child(3) { background: #a6d6e6; }
    .origin-choice:nth-child(4) { background: #f7a6bd; }
    .origin-choice:hover:not(:disabled) { transform: translate(-1px, -1px); }

    .next-button, .restart-button { margin-top: 18px; padding: 13px 18px; border: 3px solid var(--ink); color: #fff; background: var(--pink); box-shadow: 4px 4px 0 var(--ink); font-weight: 900; }
    .next-button:hover, .restart-button:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
    .hidden { display: none; }

    .study-shelf { margin-top: 32px; padding-top: 24px; border-top: 4px dashed var(--ink); }
    .study-shelf h3 { margin: 0 0 13px; font: 13px/1.5 'Press Start 2P', monospace; }
    .photo-list { display: flex; gap: 10px; flex-wrap: wrap; }
    .photo-link { padding: 10px 12px; border: 3px solid var(--ink); color: var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink); font-weight: 900; text-decoration: none; }
    .photo-link:hover { background: var(--yellow); }

    .result { text-align: center; padding: 26px 8px; }
    .result .trophy { font-size: 70px; filter: drop-shadow(4px 4px 0 var(--ink)); }
    .result h2 { margin: 18px auto 10px; }
    .result p { font-size: 20px; font-weight: 900; }

    @media (max-width: 620px) {
      .game-shell { width: min(100% - 18px, 940px); margin: 10px auto; box-shadow: 5px 5px 0 var(--shadow); }
      header { grid-template-columns: auto 1fr; padding: 16px; gap: 12px; align-items: start; }
      header .home-button { grid-column: 2; grid-row: 1; justify-self: end; margin: 0; }
      header > div:nth-child(3) { grid-column: 1 / -1; grid-row: 2; }
      .score-box { grid-column: 1 / -1; grid-row: 3; justify-self: start; }
      h1 { font-size: 12px; }
      main { padding: 18px; }
      .answers { grid-template-columns: 1fr; }
      .material-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .origin-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .question-card { min-height: 410px; box-shadow: 4px 4px 0 var(--ink); }
      .question-image { max-height: 220px; }
    }

    .subject-selector {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
      text-align: center;
      background: var(--sky);
    }
    .subject-choice {
      min-width: 220px;
      padding: 14px 18px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--ink);
      font: 900 16px 'Nunito', sans-serif;
      cursor: pointer;
    }
    .subject-choice:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .hidden-screen { display: none; }
    .home-button {
      padding: 6px 10px;
      border: 3px solid var(--ink);
      border-radius: 6px;
      color: var(--ink);
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
      font: 900 18px 'Nunito', sans-serif;
      cursor: pointer;
    }
    .english-game header { background: #f7a6bd; }
    .english-game .mission-tab.active, .english-game .next-button, .english-game .restart-button { background: #4cae67; }
  </style>
</head>
<body>
  <section class="subject-selector" aria-label="Seleção de matéria">
    <h1>CLUBE DE ESTUDOS</h1>
    <p>Escolha uma matéria para começar a estudar.</p>
    <button class="subject-choice" id="open-science" type="button">Ciências</button>
    <button class="subject-choice" id="open-english" type="button">Inglês</button>
    <p id="subject-feedback" aria-live="polite"></p>
  </section>
  <div class="game-shell hidden-screen" id="science-game">
    <header>
      <div class="pixel-badge">?</div>
      <button class="home-button" id="back-home" type="button" aria-label="Voltar para matérias">⌂</button>
      <div><h1>MISSÃO CIÊNCIAS</h1><p class="subtitle">Responda, ganhe estrelas e vire mestre dos materiais!</p></div>
      <div class="score-box"><strong id="stars">0</strong><span>ESTRELAS</span></div>
    </header>
    <main>
      <div class="mission-tabs" id="mission-tabs"></div>
      <div class="progress-line" aria-label="Progresso da missão"><div class="progress-fill" id="progress-fill"></div></div>
      <section class="question-card" id="question-card" aria-live="polite"></section>
    </main>
  </div>
  <div class="game-shell hidden-screen english-game" id="english-game">
    <header>
      <div class="pixel-badge">A B</div>
      <button class="home-button" id="back-home-english" type="button" aria-label="Voltar para matérias">⌂</button>
      <div><h1>ENGLISH QUEST</h1><p class="subtitle">Look, choose and learn new words!</p></div>
      <div class="score-box"><strong id="english-stars">0</strong><span>STARS</span></div>
    </header>
    <main>
      <div class="mission-tabs" id="english-mission-tabs"></div>
      <div class="progress-line" aria-label="English mission progress"><div class="progress-fill" id="english-progress-fill"></div></div>
      <section class="question-card" id="english-question-card" aria-live="polite"></section>
    </main>
  </div>

  <script>
    const missions = [
      { name: 'Missão 1: Objetos', questions: [
        { q: 'Uma garrafa pode ser feita de quais materiais?', options: ['Vidro ou plástico', 'Só madeira', 'Só algodão', 'Só papel'], answer: 0, tip: 'Um mesmo objeto pode ser fabricado com materiais diferentes. Existem garrafas de vidro e de plástico.' },
        { q: 'Qual objeto tem várias partes feitas de materiais diferentes?', options: ['Uma bicicleta', 'Uma pedra', 'Uma folha seca', 'Uma poça de água'], answer: 0, tip: 'A bicicleta tem, por exemplo, metal no quadro, borracha nos pneus e plástico em algumas peças.' },
        { q: 'Qual parte de uma bicicleta costuma ser de borracha?', options: ['Pneu', 'Guidão', 'Corrente', 'Pedal'], answer: 0, tip: 'O pneu precisa de borracha para ajudar a bicicleta a se movimentar.' },
        { q: 'Qual material deixa a luz passar e é usado nas janelas?', options: ['Metal', 'Vidro', 'Papelão', 'Borracha'], answer: 1, tip: 'Materiais transparentes deixam a luz passar. O vidro é um exemplo.' },
        { q: 'Qual material seria melhor para o quadro de uma bicicleta?', options: ['Metal resistente', 'Papel molhado', 'Algodão macio', 'Gelo'], answer: 0, tip: 'O quadro sustenta o peso e precisa de um material resistente, como o metal.' }
      ]},
      { name: 'Missão 2: Supermateriais', questions: [
        { q: 'Um material permeável...', options: ['deixa a água passar', 'brilha no escuro', 'sempre é pesado', 'não deixa a água passar'], answer: 0, tip: 'Permeável quer dizer que a água consegue passar pelo material.' },
        { q: 'Qual material é melhor para fazer uma capa de chuva?', options: ['Papel', 'Tecido de algodão', 'Plástico impermeável', 'Papelão'], answer: 2, tip: 'A capa protege da chuva porque precisa impedir a passagem da água.' },
        { q: 'Por que um capacete precisa ser resistente?', options: ['Para ter mais cor', 'Para proteger a cabeça', 'Para deixar a luz passar', 'Para molhar mais rápido'], answer: 1, tip: 'Um material resistente não quebra ou deforma com facilidade.' },
        { q: 'Qual objeto é feito para ser transparente?', options: ['Janela de vidro', 'Cadeado de aço', 'Pneu', 'Caixa de papelão'], answer: 0, tip: 'A transparência da janela permite enxergar através dela.' },

        { q: 'A argila é uma matéria-prima de origem...', options: ['animal', 'vegetal', 'mineral', 'artificial'], answer: 2, tip: 'A argila vem do solo. Por isso, é de origem mineral.' },
        { q: 'Qual destes é um material natural?', options: ['Madeira', 'Plástico', 'Vidro', 'Papel-alumínio'], answer: 0, tip: 'Materiais naturais são encontrados na natureza. A madeira vem das árvores.' },
        { q: 'Qual destes é um material artificial?', options: ['Algodão', 'Argila', 'Plástico', 'Lã'], answer: 2, tip: 'Materiais artificiais são produzidos pelas pessoas a partir de matérias-primas.' },

        { q: 'Onde uma lata de metal deve ser descartada?', options: ['Lixeira amarela', 'Lixeira verde', 'Lixeira vermelha', 'No chão'], answer: 0, tip: 'Na coleta seletiva estudada: amarelo é metal.' }
      ]},
      { name: 'Missão 4: Desafio do Livro', questions: [

      { name: 'Missão 7: Revisão da Professora', questions: [
        { q: 'Por que muitas panelas são feitas de metal?', options: ['Porque o metal esquenta depressa e ajuda a cozinhar os alimentos', 'Porque o metal é sempre macio', 'Porque o metal deixa a luz passar', 'Porque o metal absorve toda a água'], answer: 0, tip: 'O metal conduz o calor e esquenta depressa, por isso é muito usado no corpo das panelas.' },
        { q: 'Qual material é mais adequado para o cabo de uma panela quente?', options: ['Madeira ou plástico', 'O mesmo metal do fundo', 'Vidro fino', 'Papel molhado'], answer: 0, tip: 'Madeira e plástico esquentam menos que o metal, ajudando a proteger as mãos.' },
        { q: 'Qual frase mostra que um mesmo material pode formar objetos diferentes?', options: ['O vidro pode ser usado em janelas e em copos', 'Toda janela precisa ser feita de madeira', 'Uma bola só pode ser feita de metal', 'Cada objeto usa um único material no mundo'], answer: 0, tip: 'Um mesmo material pode ser usado em vários objetos com funções diferentes.' },
        { q: 'Uma bola cai no chão sem quebrar; uma taça de vidro cai e quebra. Qual material mostrou maior resistência ao impacto?', options: ['O material da bola', 'O vidro da taça', 'Os dois igualmente', 'Nenhum dos dois'], answer: 0, tip: 'Resistência é a capacidade de não quebrar facilmente quando sofre impacto, como uma queda.' },
        { q: 'Qual exemplo mostra corretamente um material permeável?', options: ['Um coador de pano deixa o líquido passar', 'Uma capa de chuva bloqueia a água', 'Uma garrafa fechada não deixa líquido sair', 'Um vidro de janela impede a passagem de água'], answer: 0, tip: 'Um material permeável permite que um líquido passe por ele.' },
        { q: 'Qual situação mostra elasticidade?', options: ['Um elástico é esticado e volta ao tamanho inicial', 'Um copo de vidro quebra ao cair', 'Um papel absorve água', 'Uma janela deixa a luz passar'], answer: 0, tip: 'Elasticidade permite que o objeto seja deformado e depois volte à sua forma original.' }
      ]},

      const cards = card.querySelectorAll('.material-card');
      const choices = card.querySelectorAll('.origin-choice');
      cards.forEach(button => button.addEventListener('click', () => {
        if (button.classList.contains('done')) return;
        cards.forEach(cardButton => cardButton.classList.remove('selected'));
        button.classList.add('selected');
        selectedItem = Number(button.dataset.item);
        document.querySelector('#match-help').textContent = `Você escolheu: ${mission.items[selectedItem].name}. Agora escolha a origem.`;
      }));
      choices.forEach(button => button.addEventListener('click', () => {
        const feedback = document.querySelector('#feedback');
        if (selectedItem === null) { feedback.textContent = 'Primeiro escolha um desenho.'; feedback.className = 'feedback bad'; return; }
        const item = mission.items[selectedItem];
        if (button.dataset.origin === item.origin) {
          cards[selectedItem].classList.add('done');
          correctCount++;
          stars++;
          starDisplay.textContent = stars;
          progress.style.width = `${(correctCount / mission.items.length) * 100}%`;
          feedback.textContent = `Muito bem! ${item.name} tem origem ${originNames[item.origin].toLowerCase()}.`;
          feedback.className = 'feedback good';
          selectedItem = null;
          if (correctCount === mission.items.length) {
            choices.forEach(choice => { choice.disabled = true; });
            document.querySelector('#match-help').textContent = 'Você classificou todos os materiais!';
            card.insertAdjacentHTML('beforeend', '<button class="next-button" id="next-button">Ver resultado</button>');
            document.querySelector('#next-button').addEventListener('click', showResult);
          }
        } else {
          cards.forEach(cardButton => cardButton.classList.toggle('selected', Number(cardButton.dataset.item) === selectedItem));
          feedback.textContent = `Tente de novo. ${item.name} não tem origem ${originNames[button.dataset.origin].toLowerCase()}.`;
          feedback.className = 'feedback bad';
        }
      }));
    }

        const item = mission.items[selectedItem];

    function chooseAnswer(selected) {
      if (answered) return;
      answered = true;
      const question = missions[missionIndex].questions[questionIndex];
      const options = card.querySelectorAll('.answer');
      const feedback = document.querySelector('#feedback');
      options.forEach(option => { option.disabled = true; if (Number(option.dataset.answer) === question.answer) option.classList.add('correct'); });
      if (selected === question.answer) {
        stars++;
        starDisplay.textContent = stars;
        feedback.textContent = 'Acertou! Você ganhou uma estrela.';
        feedback.className = 'feedback good';
      } else {
        Array.from(options).find(option => Number(option.dataset.answer) === selected).classList.add('wrong');
        feedback.textContent = `Quase! ${question.tip}`;
        feedback.className = 'feedback bad';
      }
      document.querySelector('#next-button').classList.remove('hidden');
      document.querySelector('#next-button').addEventListener('click', nextQuestion);
    }

    function nextQuestion() {
      const mission = missions[missionIndex];
      if (questionIndex < mission.questions.length - 1) { questionIndex++; renderQuestion(); return; }
      if (missionIndex < missions.length - 1) { missionIndex++; questionIndex = 0; renderTabs(); renderQuestion(); return; }
      showResult();
    }

    function showResult() {
      progress.style.width = '100%';
      card.innerHTML = `<div class="result"><div class="trophy">★</div><p class="topic">MISSÃO CONCLUÍDA</p><h2>Você terminou a Missão Ciências!</h2><p>Você conquistou ${stars} de ${totalQuestions} estrelas.</p><button class="restart-button" id="restart">Jogar novamente</button></div>`;
      document.querySelector('#restart').addEventListener('click', () => { missionIndex = 0; questionIndex = 0; stars = 0; starDisplay.textContent = stars; renderTabs(); renderQuestion(); });
    }

    let englishMissionIndex = 0;
    let englishQuestionIndex = 0;
    let englishStars = 0;
    let englishAnswered = false;
    const englishTabs = document.querySelector('#english-mission-tabs');
    const englishCard = document.querySelector('#english-question-card');
    const englishStarDisplay = document.querySelector('#english-stars');
    const englishProgress = document.querySelector('#english-progress-fill');

    function renderEnglishTabs() {
      englishTabs.innerHTML = `<button class="mission-tab" id="english-study-guide">Study Guide</button>${englishMissions.map((mission, index) => `<button class="mission-tab ${index === englishMissionIndex ? 'active' : ''}" data-english-mission="${index}">${mission.name}</button>`).join('')}`;
      document.querySelector('#english-study-guide').addEventListener('click', renderEnglishStudyGuide);
      englishTabs.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
        if (!button.dataset.englishMission) return;
        englishMissionIndex = Number(button.dataset.englishMission); englishQuestionIndex = 0; renderEnglishTabs(); renderEnglishQuestion();
      }));
    }

    function renderEnglishStudyGuide() {
      englishProgress.style.width = '0%';
      englishCard.innerHTML = `<p class="topic">ENGLISH REFERENCE</p><h2>Study Guide: Materials and Mixtures</h2><p class="feedback good">Materials: brick, plastic, wood, paper, glass and metal.</p><p><strong>Properties:</strong> rough / smooth, absorbent / waterproof, soft / hard, flexible / rigid.</p><p><strong>Origins:</strong> Natural materials come from nature. Manufactured materials are made by people.</p><p><strong>Mixtures:</strong> Pure means one substance. Homogeneous looks the same. Heterogeneous has parts we can see.</p><p><strong>Separate mixtures:</strong> filtration, evaporation, distillation and magnetism. A magnet attracts metal.</p><p>Open-photo sources and licence details: <a href="https://commons.wikimedia.org/wiki/File:Brick_wall_close-up_view.jpg" target="_blank">brick wall</a>, <a href="https://commons.wikimedia.org/wiki/File:Rain_boots_on_Stairs.jpg" target="_blank">rain boots</a>, <a href="https://commons.wikimedia.org/wiki/File:Magnetic_influence_in_paperclip.jpg" target="_blank">magnet</a>, and the Wikimedia Commons file pages linked by each photo.</p><button class="next-button" id="back-to-english">Back to missions</button>`;
      document.querySelector('#back-to-english').addEventListener('click', renderEnglishQuestion);
    }

    function renderEnglishQuestion() {
      englishAnswered = false;
      const mission = englishMissions[englishMissionIndex];
      const question = mission.questions[englishQuestionIndex];
      const shuffledOptions = question.options.map((option, index) => ({ option, index })).sort(() => Math.random() - 0.5);
      englishProgress.style.width = `${(englishQuestionIndex / mission.questions.length) * 100}%`;
      englishCard.innerHTML = `<p class="topic">${mission.name.toUpperCase()}</p><span class="question-number">${englishQuestionIndex + 1} / ${mission.questions.length}</span><img class="question-image" src="${question.image}" alt="${question.alt}"><h2>${question.q}</h2><div class="answers">${shuffledOptions.map(({ option, index }, displayIndex) => `<button class="answer" data-english-answer="${index}"><span class="answer-key">${String.fromCharCode(65 + displayIndex)}</span>${option}</button>`).join('')}</div><p class="feedback" id="english-feedback"></p><button class="next-button hidden" id="english-next-button">Next question</button>`;
      englishCard.querySelectorAll('.answer').forEach(button => button.addEventListener('click', () => chooseEnglishAnswer(Number(button.dataset.englishAnswer))));
    }

    function chooseEnglishAnswer(selected) {
      if (englishAnswered) return;
      englishAnswered = true;
      const question = englishMissions[englishMissionIndex].questions[englishQuestionIndex];
      const options = englishCard.querySelectorAll('.answer');
      const feedback = document.querySelector('#english-feedback');
      options.forEach(option => { option.disabled = true; if (Number(option.dataset.englishAnswer) === question.answer) option.classList.add('correct'); });
      if (selected === question.answer) {
        englishStars++;
        englishStarDisplay.textContent = englishStars;
        feedback.textContent = 'Great job! You earned one star.';
        feedback.className = 'feedback good';
      } else {
        Array.from(options).find(option => Number(option.dataset.englishAnswer) === selected).classList.add('wrong');
        feedback.textContent = `Try again next time. ${question.tip}`;
        feedback.className = 'feedback bad';
      }
      document.querySelector('#english-next-button').classList.remove('hidden');
      document.querySelector('#english-next-button').addEventListener('click', nextEnglishQuestion);
    }

    function nextEnglishQuestion() {
      const mission = englishMissions[englishMissionIndex];
      if (englishQuestionIndex < mission.questions.length - 1) { englishQuestionIndex++; renderEnglishQuestion(); return; }
      if (englishMissionIndex < englishMissions.length - 1) { englishMissionIndex++; englishQuestionIndex = 0; renderEnglishTabs(); renderEnglishQuestion(); return; }
      const total = englishMissions.reduce((count, missionItem) => count + missionItem.questions.length, 0);
      englishProgress.style.width = '100%';
      englishCard.innerHTML = `<div class="result"><div class="trophy">★</div><p class="topic">ENGLISH QUEST COMPLETE</p><h2>Fantastic work!</h2><p>You earned ${englishStars} of ${total} stars.</p><button class="restart-button" id="english-restart">Play again</button></div>`;
      document.querySelector('#english-restart').addEventListener('click', () => { englishMissionIndex = 0; englishQuestionIndex = 0; englishStars = 0; englishStarDisplay.textContent = englishStars; renderEnglishTabs(); renderEnglishQuestion(); });
    }

    const subjectSelector = document.querySelector('.subject-selector');
    const scienceGame = document.querySelector('#science-game');
    const englishGame = document.querySelector('#english-game');
    const subjectFeedback = document.querySelector('#subject-feedback');
    document.querySelector('#open-science').addEventListener('click', () => {
      subjectSelector.classList.add('hidden-screen');
      scienceGame.classList.remove('hidden-screen');
    });
    document.querySelector('#back-home').addEventListener('click', () => {
      subjectSelector.classList.remove('hidden-screen');
      scienceGame.classList.add('hidden-screen');
    });
    document.querySelector('#open-english').addEventListener('click', () => {
      subjectFeedback.textContent = '';
      subjectSelector.classList.add('hidden-screen');
      englishGame.classList.remove('hidden-screen');
    });
    document.querySelector('#back-home-english').addEventListener('click', () => {
      subjectSelector.classList.remove('hidden-screen');
      englishGame.classList.add('hidden-screen');
    });

    renderTabs();
    renderQuestion();
    renderEnglishTabs();
    renderEnglishQuestion();
  </script>
